# Le site dans un conteneur, servi sur http://localhost:3000 (README, « Démarrer »).
# Le même fichier sert sur un poste (Linux, macOS, Windows) et sur le serveur, sans
# aucun réglage à faire sur la machine.

services:
  site:
    build: .
    image: 4l-lesfarfadets-site
    container_name: 4l-lesfarfadets-site
    restart: always
    # 127.0.0.1 : le site n'est joignable que depuis la machine. Un port publié
    # sans adresse serait ouvert sur le réseau, pare-feu ou non.
    ports:
      - "127.0.0.1:3000:3000"
    # Garde de la mémoire pour le reste du serveur (4 Go en tout).
    mem_limit: 512m
    # Journal d'accès : un fichier par jour, ceux de plus de six mois supprimés
    # par le site lui-même (src/server/access-log.ts).
    volumes:
      - access-logs:/app/logs

volumes:
  access-logs:
