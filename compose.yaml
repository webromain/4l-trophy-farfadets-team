# Le site dans un conteneur, servi sur http://localhost:3000 (README, « Démarrer »).
# Le même fichier sert sur un poste (Linux, macOS, Windows) et sur le serveur.

services:
  site:
    build: .
    image: farfadets-site
    container_name: 4l-farfadets-site
    restart: always
    # 127.0.0.1 : le site n'est joignable que depuis la machine. Un port publié
    # sans adresse serait ouvert sur le réseau, pare-feu ou non.
    ports:
      - "127.0.0.1:3000:3000"
    # Garde de la mémoire pour le reste du serveur (4 Go en tout).
    mem_limit: 512m
    # Sur le serveur, LOG_DRIVER=journald (dans le .env voisin) envoie le journal
    # d'accès à journald, réglé pour tout supprimer au bout de six mois : la durée
    # promise par la page Confidentialité. Ailleurs, le pilote `local` de Docker,
    # le seul disponible partout (Docker Desktop n'a pas journald).
    logging:
      driver: ${LOG_DRIVER:-local}
